coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=static
internal-communication.shared-secret=supersecretkey
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino-kerberos/trino-kerberos.pem
http-server.authentication.type=KERBEROS
http.authentication.krb5.config=/etc/krb5.conf
http-server.authentication.krb5.service-name=trino
http-server.authentication.krb5.principal-hostname=trino-kerberos
http-server.authentication.krb5.keytab=/etc/trino-kerberos/trino.keytab
http-server.authentication.krb5.user-mapping.pattern=(.*)@.*
