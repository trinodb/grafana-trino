name: Release

on:
  push:
    tags:
      - "v*.*.*" # Run workflow on version tags, e.g. v1.0.0.

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # build-plugin runs a bare `yarn install` and its own setup-node, so the
      # shim needs GITHUB_PATH to keep precedence over the preinstalled Yarn 1.
      - name: Enable corepack
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin"
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"

      - name: Verify yarn comes from corepack
        run: |
          which yarn
          yarn --version | grep -q '^4\.' || {
            echo "expected Yarn 4 from corepack, got $(yarn --version)" >&2
            exit 1
          }

      - name: Build, sign, and package plugin
        uses: grafana/plugin-actions/build-plugin@main
        with:
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          attestation: true
          node-version: "24"
          go-version: "1.26.7"
