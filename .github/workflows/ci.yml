name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  vulnerability-scan:
    name: Scan dependencies for known vulnerabilities
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --no-call-analysis=go
        --lockfile=./go.mod
        --lockfile=./yarn.lock
      upload-sarif: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint frontend
        run: yarn lint

      - name: Typecheck frontend
        run: yarn typecheck

      - name: Test frontend
        run: yarn test:ci

      - name: Build frontend
        run: yarn build

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Scan backend dependencies for reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Scan backend source for security issues
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet ./...

      - name: Test backend
        uses: magefile/mage-action@v4
        with:
          version: latest
          args: coverage

      - name: Build backend
        uses: magefile/mage-action@v4
        with:
          version: latest
          args: buildAll

      - name: Upload built plugin
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 5

  resolve-versions:
    name: Resolve e2e Grafana versions
    runs-on: ubuntu-latest
    needs: build
    outputs:
      matrix: ${{ steps.resolve-versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Grafana E2E versions
        id: resolve-versions
        uses: grafana/plugin-actions/e2e-version@e2e-version/v3.0.2
        with:
          # Resolves against plugin.json's dependencies.grafanaDependency
          # (>=10.4.0): the latest patch of every minor satisfying that
          # range. Nightly is intentionally excluded because its unstable UI
          # is outside our supported Grafana versions.
          version-resolver-type: plugin-grafana-dependency
          skip-grafana-nightly-image: true

  e2e:
    name: e2e ${{ matrix.GRAFANA_IMAGE.name }}@${{ matrix.GRAFANA_IMAGE.version }}
    needs: [build, resolve-versions]
    strategy:
      fail-fast: false
      matrix:
        GRAFANA_IMAGE: ${{ fromJson(needs.resolve-versions.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download built plugin
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Make backend executables runnable
        run: chmod +x dist/gpx_*

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup services (Trino, Grafana, PostgreSQL, Keycloak)
        run: |
          docker network create trino

          echo "Starting PostgreSQL..."
          docker run --rm --detach \
            --name postgres \
            --net trino \
            --env POSTGRES_USER=keycloak \
            --env POSTGRES_PASSWORD=keycloak \
            --env POSTGRES_DB=keycloak \
            postgres:17.4

          echo "Starting Keycloak..."
          docker run --rm --detach \
            --name keycloak \
            --net trino \
            --publish 18080:8080 \
            --env KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            --env KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            --env KC_DB=postgres \
            --env KC_DB_URL_HOST=postgres \
            --env KC_DB_URL_DATABASE=keycloak \
            --env KC_DB_USERNAME=keycloak \
            --env KC_DB_PASSWORD=keycloak \
            --volume "$(pwd)/test-data/test-keycloak-realm.json:/opt/keycloak/data/import/realm.json" \
            quay.io/keycloak/keycloak:26.1.4 \
            start-dev --import-realm

          echo "Waiting for Keycloak to be ready..."
          while true; do
            if curl -s http://localhost:18080/realms/master | grep -q "realm"; then
              echo "Keycloak is ready!"
             break
           fi
            echo "Waiting for Keycloak..."
           sleep 5
          done

          echo "Starting Trino..."
          docker run --rm --detach \
            --name trino \
            --net trino \
            --volume "$(pwd)/test-data/trino/test-trino-config.properties:/etc/trino/config.properties" \
            --volume "$(pwd)/test-data/trino/catalog/hive.properties:/etc/trino/catalog/hive.properties" \
            trinodb/trino:483

          echo "Waiting for Trino to be ready..."
          while true; do
            if docker logs trino 2>&1 | grep -q '======== SERVER STARTED ========'; then
              echo "Trino is ready!"
              break
            fi
            echo "Waiting for Trino..."
            sleep 5
          done

          echo "Preconfiguring trino..."
          docker exec trino trino --user admin --execute "GRANT admin TO USER grafana IN hive;"

          echo "Starting Grafana grafana/${{ matrix.GRAFANA_IMAGE.name }}:${{ matrix.GRAFANA_IMAGE.version }}..."
          docker run --rm --detach \
            --name grafana \
            --net trino \
            --publish 3000:3000 \
            --volume "$(pwd)/dist:/var/lib/grafana/plugins/trino" \
            --env "GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=trino-datasource" \
            "grafana/${{ matrix.GRAFANA_IMAGE.name }}:${{ matrix.GRAFANA_IMAGE.version }}"
          echo "Done."

      - name: Wait for Grafana
        uses: grafana/plugin-actions/wait-for-grafana@wait-for-grafana/v1.0.5
        with:
          url: http://localhost:3000/login

      - name: End to end test
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Grafana logs (on failure)
        if: failure()
        run: docker logs grafana
